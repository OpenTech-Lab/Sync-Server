name: Security & Reliability

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  dependency-scan:
    name: Dependency scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/dashboard/package-lock.json

      - name: Dashboard npm audit
        working-directory: server/dashboard
        run: |
          npm ci
          npm audit --audit-level=high

  container-scan:
    name: Container vulnerability scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t sync-server:scan ./server

      - name: Build dashboard image
        run: docker build -t sync-dashboard:scan ./server/dashboard

      # SECURITY: aquasecurity/trivy-action tags were compromised 2026-03-19.
      # Install Trivy directly from a pinned GitHub release binary instead.
      # Before running: set TRIVY_VERSION and TRIVY_DEB_SHA256 to values you have
      # verified from https://github.com/aquasecurity/trivy/releases (use any version < 0.69.4).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "REPLACE_ME"     # e.g. 0.59.1
          TRIVY_DEB_SHA256: "REPLACE_ME"  # SHA256 of trivy_${TRIVY_VERSION}_Linux-64bit.deb
        run: |
          DEB="trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          curl -sLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${DEB}"
          echo "${TRIVY_DEB_SHA256}  ${DEB}" | sha256sum --check
          sudo dpkg -i "${DEB}"

      - name: Scan server image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 sync-server:scan

      - name: Scan dashboard image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 sync-dashboard:scan

  load-baseline:
    name: Load baseline smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sync_test
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://sync:testpassword@localhost:5432/sync_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production-and-very-long
      INSTANCE_NAME: ci-test
      INSTANCE_DOMAIN: localhost
      APP_ENV: development
      ENFORCE_HTTPS: false
      ADMIN_EMAIL: admin@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Start server
        run: cargo run &

      - name: Wait for health endpoint
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Run load baseline
        run: bash scripts/load_baseline.sh -u http://localhost:8080 -n 300 -c 20
